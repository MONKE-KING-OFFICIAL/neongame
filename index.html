<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Overdrive</title>
    <!-- Tailwind CSS for utility layouts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- External CSS link -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD (Heads Up Display) -->
    <div class="ui-overlay hud">
        <div>
            <div id="score">SCORE: 0</div>
            <div class="stat-bar"><div id="health-fill"></div></div>
            <div class="text-xs mt-1">HULL INTEGRITY</div>
        </div>
        <div class="text-right">
            <div id="level">LVL: 1</div>
            <div class="stat-bar"><div id="xp-fill"></div></div>
            <div class="text-xs mt-1 text-cyan-400">XP PROGRESS</div>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="menu" class="ui-overlay">
        <h1 class="text-5xl font-bold mb-4 text-cyan-400 italic">NEON OVERDRIVE</h1>
        <p class="mb-6 text-gray-300">WASD/Arrows to Move. Mouse to Aim/Shoot.<br>Survive the geometric swarm.</p>
        <button class="btn" onclick="startGame()">Initiate Link</button>
    </div>

    <!-- Upgrade Screen -->
    <div id="upgrade-screen" class="ui-overlay hidden">
        <h2 class="text-3xl font-bold mb-4 text-yellow-400">LEVEL UP!</h2>
        <p class="mb-6">Select an augmentation:</p>
        <div id="upgrade-list" class="flex flex-col gap-3">
            <!-- Level up choices appear here -->
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over" class="ui-overlay hidden">
        <h2 class="text-4xl font-bold mb-2 text-red-500">SYSTEM FAILURE</h2>
        <div id="final-score" class="text-xl mb-6">SCORE: 0</div>
        <button class="btn" onclick="location.reload()">Reboot System</button>
    </div>
</div>

<!-- External JavaScript link -->
<script src="game.js"></script>
</body>
</html>
